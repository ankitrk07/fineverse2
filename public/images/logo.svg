<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="70%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>
    <linearGradient id="planetGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="35%" stop-color="#11998e" />
      <stop offset="70%" stop-color="#00bcd4" />
      <stop offset="100%" stop-color="#0f2027" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8ff78" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="transparent" />

  <!-- Orbit Rings Background -->
  <circle cx="250" cy="230" r="160" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 6" />
  <circle cx="250" cy="230" r="130" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.25" />

  <!-- Upper Satellite Moon -->
  <circle cx="205" cy="115" r="20" fill="#00f0ff" filter="url(#glow)" opacity="0.9" />
  <circle cx="202" cy="112" r="18" fill="url(#planetGrad)" />
  <path d="M 195 105 A 18 18 0 0 1 220 125 A 20 20 0 0 0 195 105" fill="#050811" opacity="0.6" />

  <!-- Distant Stars & Moons -->
  <circle cx="120" cy="245" r="4" fill="#00f2fe" opacity="0.6" />
  <circle cx="380" cy="190" r="7" fill="#38ef7d" opacity="0.7" filter="url(#glow)" />
  <circle cx="150" cy="150" r="2.5" fill="#ffffff" opacity="0.7" />
  <circle cx="350" cy="300" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="170" cy="320" r="2" fill="#00f2fe" opacity="0.5" />
  <circle cx="390" cy="110" r="2.5" fill="#a8ff78" opacity="0.6" />

  <!-- Planet Sphere (Back Side Behind Ring) -->
  <g>
    <!-- Shadow & Planet Body -->
    <circle cx="250" cy="230" r="92" fill="url(#planetGrad)" filter="url(#glow)" opacity="0.4" />
    <circle cx="250" cy="230" r="90" fill="#060d1a" />
    <circle cx="250" cy="230" r="90" fill="url(#planetGrad)" />
    
    <!-- Atmospheric Bands & Shadow -->
    <path d="M 160 230 A 90 90 0 0 0 340 230 A 90 35 0 0 1 160 230" fill="#040914" opacity="0.5" />
    <path d="M 165 205 Q 250 255 335 205 A 90 90 0 0 1 340 230 Q 250 280 160 230 Z" fill="#000000" opacity="0.4" />
    <path d="M 160 230 A 90 90 0 0 0 325 290 Q 250 220 160 230" fill="#02040a" opacity="0.6" />
    
    <!-- Planet Edge Highlight -->
    <path d="M 175 180 A 90 90 0 0 1 305 155" stroke="#ccff00" stroke-width="3" stroke-linecap="round" opacity="0.7" filter="url(#glow)" />
  </g>

  <!-- Giant Planetary Rings (Tilted 3D Ring System) -->
  <!-- Outer glowing aura -->
  <ellipse cx="250" cy="230" rx="145" ry="60" transform="rotate(-26 250 230)" stroke="#00f2fe" stroke-width="12" opacity="0.3" filter="url(#glow)" fill="none" />
  
  <!-- Primary Sharp Ring -->
  <ellipse cx="250" cy="230" rx="142" ry="58" transform="rotate(-26 250 230)" stroke="url(#ringGrad)" stroke-width="8" fill="none" />
  
  <!-- Inner Ring Groove -->
  <ellipse cx="250" cy="230" rx="122" ry="48" transform="rotate(-26 250 230)" stroke="#ffffff" stroke-width="2.5" opacity="0.9" fill="none" />
  <ellipse cx="250" cy="230" rx="112" ry="42" transform="rotate(-26 250 230)" stroke="#38ef7d" stroke-width="1.5" opacity="0.6" fill="none" />

  <!-- Front Semi-Globe Cut to sit atop ring correctly -->
  <path d="M 170 195 A 90 90 0 0 1 332 205 Q 260 290 170 195 Z" fill="url(#planetGrad)" opacity="0.25" />

  <!-- Front Arc of Ring passing over planet -->
  <path d="M 125 285 C 160 330, 310 280, 375 175" transform="rotate(-1 250 230)" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.9" />

  <!-- Brand Typography -->
  <text x="250" y="420" text-anchor="middle" font-family="'Space Grotesk', 'Impact', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="14" fill="#FFFFFF">
    FINEVERSE
  </text>
  
  <!-- Subtitle Accent -->
  <text x="250" y="445" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="10" letter-spacing="6" fill="#CCFF00">
    WEAR THE UNIVERSE
  </text>
</svg>
